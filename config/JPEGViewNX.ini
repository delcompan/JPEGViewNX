[Settings]
; ---------------------------------------------------------------------------
; Language: zh (default) or en. Also switchable from the right-click menu.
Language=zh

; RawMode: how camera RAW files are decoded.
;   auto    = embedded JPEG preview first (fast, same as JPEGView), then the
;             full RAW decoder from WIC if no preview exists
;   preview = embedded JPEG preview only
;   full    = full RAW through WIC first, embedded preview as fallback
RawMode=auto

; Window background (R G B), used outside the image - same key as JPEGView.
BackgroundColor=0 0 0

; Colour used for transparent pixels when TransparencyMode=solid (JPEGView's
; only behaviour). Defaults to BackgroundColor, like JPEGView.
TransparencyColor=0 0 0

; THE FIX: how an alpha image is put on screen.
;   checker = checkerboard behind the image (new default)
;   solid   = flatten onto TransparencyColor (JPEGView's behaviour)
;   none    = show BackgroundColor through transparent pixels
TransparencyMode=checker

CheckerCellSize=8
CheckerColor1=64 64 64
CheckerColor2=96 96 96

SmoothResampling=true
ShowFileName=true
